[package]
name = "spotty"
version = "0.0.1"
edition = "2024"
authors = ["Vo Quoc Linh", "night0"]
description = "A modern Terminal User Interface for Spotify"

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29"

rspotify = { version = "0.16", features = ["client-reqwest", "env-file", "cli"] }

tokio = { version = "1.51", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
dirs = "6.0.0"

serde_json = "1.0.149"

dotenv = "0.15"
anyhow = "1.0"
chrono = "0.4.44"
rand = "0.10.0"
urlencoding = "2.1.3"

librespot-core = "0.8.0"
librespot-playback = { version = "0.8.0", features = ["rodio-backend"] }
librespot-connect = "0.8.0"
# fix for https://github.com/aome510/spotify-player/issues/914
vergen = "=9.0.6"
librespot-oauth = "0.8.0"
librespot-metadata = "0.8.0"

[[bin]]
path = "src/main.rs"
name = "spotty"
bench = false
